# actionlint does not know the Ubuntu 26.04 runner labels yet - declare them
# here to avoid false "label is unknown" errors. Drop once actionlint adds them.
self-hosted-runner:
  labels:
    - ubuntu-26.04-arm
# gh-aw generated lock files use features actionlint does not know yet
paths:
  .github/workflows/*.lock.yml:
    ignore:
      - 'property "workflow_ref" is not defined'
      - 'unexpected key "queue" for "concurrency" section'
