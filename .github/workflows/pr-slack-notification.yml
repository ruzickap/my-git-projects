---
# GitHub Actions workflow for PR Slack notifications
# Sends Slack notifications for pull request events and updates with status changes
# Based on: https://github.com/slackapi/slack-github-action/issues/269
name: pr-slack-notification

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - review_requested
      - closed
  issue_comment: # zizmor: ignore[dangerous-triggers] - only posts PR status to Slack, no checkout, only actions: read
    types:
      - created
  pull_request_review:
    types:
      - submitted

permissions: {}

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  pr-slack-notification:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions: {}
    if: (github.event.action == 'opened' && github.event.pull_request.draft == false) || github.event.action == 'ready_for_review'
    steps:
      - name: Post PR summary message to slack
        id: message
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          errors: true
          token: ${{ secrets.MY_SLACK_BOT_TOKEN }}
          # "text" is a YAML block (>-) - a quote in the PR title would end a "..." string and break the payload
          payload: |
            channel: ${{ secrets.MY_SLACK_CHANNEL_ID }}
            text: >-
              💡 *${{ github.event.pull_request.user.login }}*: <${{ github.event.repository.html_url }}|${{ github.repository }}> - <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}> (+${{ github.event.pull_request.additions }}, -${{ github.event.pull_request.deletions }})

      - name: Create file with slack message timestamp
        env:
          TS: ${{ steps.message.outputs.ts }}
        run: |
          echo "${TS}" > slack-message-timestamp.txt

      # Artifacts are kept for the repo retention period (90 days by default) - a cache entry that is never restored is deleted after 7
      - name: Save slack message timestamp
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slack-message-timestamp-${{ github.event.pull_request.number }}
          path: slack-message-timestamp.txt

  slack-emoji-react:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read # needed to download the timestamp artifact
    name: Adds emoji reaction to slack message when a PR is closed or reviewed
    if: ${{ startsWith(github.event.pull_request.html_url, 'https') || startsWith(github.event.issue.pull_request.html_url, 'https') }}
    steps:
      - name: Retrieve Slack message timestamp
        id: slack-timestamp
        env:
          ARTIFACT_NAME: slack-message-timestamp-${{ github.event.pull_request.number || github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip artifacts from fork runs - a fork pull request can upload one with any name and content
          RUN_IDS=$(gh api --paginate "repos/${GH_REPO}/actions/artifacts?name=${ARTIFACT_NAME}" --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id')
          RUN_ID=${RUN_IDS%%$'\n'*} # the API lists the newest artifact first
          if [[ -n "${RUN_ID}" ]]; then
            gh run download "${RUN_ID}" --name "${ARTIFACT_NAME}" --dir "${RUNNER_TEMP}/${ARTIFACT_NAME}"
            SLACK_TIMESTAMP=$(< "${RUNNER_TEMP}/${ARTIFACT_NAME}/slack-message-timestamp.txt")
            # The value goes into GITHUB_ENV and the Slack payloads - accept only a message timestamp
            if [[ "${SLACK_TIMESTAMP}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "SLACK_TIMESTAMP=${SLACK_TIMESTAMP}" | tee -a "${GITHUB_ENV}"
              echo "github_event_pull_request_html_url=true" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Decide which emoji to add
        if: ${{ steps.slack-timestamp.outputs.github_event_pull_request_html_url == 'true' }}
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          case "${GITHUB_EVENT_ACTION}" in
            created)
              if [[ "${GITHUB_EVENT_NAME}" == 'issue_comment' ]]; then
                echo "EMOJI=speech_balloon" >> "${GITHUB_ENV}" # 💬
              fi
              ;;
            submitted)
              case "${GITHUB_EVENT_REVIEW_STATE}" in
                changes_requested)
                  echo "EMOJI=repeat" >> "${GITHUB_ENV}" # 🔁
                  ;;
                approved)
                  echo "EMOJI=ok" >> "${GITHUB_ENV}" # 🆗
                  ;;
                commented)
                  echo "EMOJI=speech_balloon" >> "${GITHUB_ENV}" # 💬
                  ;;
              esac
              ;;
            review_requested)
              echo "EMOJI=eyes" >> "${GITHUB_ENV}" # 👀
              ;;
            *)
              echo "EMOJI=false" >> "${GITHUB_ENV}"
              ;;
          esac

      - name: React to PR summary message in slack with emoji
        if: ${{ steps.slack-timestamp.outputs.github_event_pull_request_html_url == 'true' && env.EMOJI != 'false' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: reactions.add
          token: ${{ secrets.MY_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.MY_SLACK_CHANNEL_ID }}
            timestamp: "${{ env.SLACK_TIMESTAMP }}"
            name: ${{ env.EMOJI }}

      - name: Update the original message with status Merged ✅
        if: ${{ github.event.pull_request.merged && steps.slack-timestamp.outputs.github_event_pull_request_html_url == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.MY_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.MY_SLACK_CHANNEL_ID }}
            ts: "${{ env.SLACK_TIMESTAMP }}"
            text: >-
              ✅ *${{ github.event.pull_request.user.login }}*: <${{ github.event.repository.html_url }}|${{ github.repository }}> - <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}> (+${{ github.event.pull_request.additions }}, -${{ github.event.pull_request.deletions }})
            attachments:
              - color: "#28a745"
                fields:
                  - title: "Status"
                    short: true
                    value: "Merged ✅"

      - name: Update the original message with status Closed ❎
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == false && steps.slack-timestamp.outputs.github_event_pull_request_html_url == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.MY_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.MY_SLACK_CHANNEL_ID }}
            ts: "${{ env.SLACK_TIMESTAMP }}"
            text: >-
              ❎ *${{ github.event.pull_request.user.login }}*: <${{ github.event.repository.html_url }}|${{ github.repository }}> - <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}> (+${{ github.event.pull_request.additions }}, -${{ github.event.pull_request.deletions }})
            attachments:
              - color: "#fa7015"
                fields:
                  - title: "Status"
                    short: true
                    value: "Closed ❎"
