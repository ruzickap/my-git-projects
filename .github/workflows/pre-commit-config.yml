name: pre-commit-config

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "!chore/renovate/*"
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/pre-commit-config.yml

env:
  SKIP: no-commit-to-branch
  # Use OpenTofu for the antonbabenko/pre-commit-terraform hooks
  PCT_TFPATH: tofu

defaults:
  run:
    shell: bash -euxo pipefail {0}

permissions: {}

jobs:
  pre-commit-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          mise_toml: |
            [tools]
            actionlint = "latest"
            betterleaks = "latest"
            # checkov does not provide arm64 binaries (x86_64 only)
            checkov = "latest"
            opentofu = "latest"
            terraform-docs = "latest"
            tflint = "latest"
            tfupdate = "latest"
            trivy = "latest"

      - name: Verify tool versions
        run: |
          actionlint --version
          betterleaks version
          checkov --version
          tofu -version
          terraform-docs --version
          tflint --version
          tfupdate --version
          trivy version

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
