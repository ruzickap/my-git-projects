name: pre-commit-config

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "!chore/renovate/*"
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/pre-commit-config.yml

env:
  SKIP: no-commit-to-branch
  # Use OpenTofu for the antonbabenko/pre-commit-terraform hooks
  PCT_TFPATH: tofu

defaults:
  run:
    shell: bash -euxo pipefail {0}

permissions: read-all

jobs:
  pre-commit-config:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          mise_toml: |
            [tools]
            actionlint = "latest"
            betterleaks = "latest"
            checkov = "latest"
            opentofu = "latest"
            terraform-docs = "latest"
            terrascan = "latest"
            tflint = "latest"
            tfupdate = "latest"
            trivy = "latest"

      - name: Verify tool versions
        run: |
          actionlint --version
          betterleaks version
          checkov --version
          tofu -version
          terraform-docs --version
          terrascan version
          tflint --version
          tfupdate --version
          trivy version

      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
