[tools]
opentofu = "1.13.1"
fnox = "1.39.0"

[env]
AWS_PROFILE = "my-aws"
AWS_REGION = "eu-central-1"

# fnox (fnox.toml) injects TF_VAR_* secrets from AWS SSM Parameter Store
[tasks.init]
description = "Run tofu init with secrets from fnox"
run = "fnox exec -- tofu init"

[tasks.plan]
description = "Run tofu plan with secrets from fnox"
run = "fnox exec -- tofu plan"

[tasks.apply]
description = "Run tofu apply with secrets from fnox"
run = "fnox exec -- tofu apply"
